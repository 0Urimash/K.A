<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | K.Artes</title>

    <!-- CSS da K.Artes -->
    <link rel="stylesheet" href="assets/.css/custom.css">

</head>

<body class="login-page">

    <main class="login-container">

        <div class="login-card">

            <div class="text-center mb-4">

                <img
                    src="assets/images/logo.png"
                    alt="Logo da K.Artes"
                    class="login-logo">

                <h1>K.Artes</h1>

                <p>
                    Acesso ao painel administrativo
                </p>

            </div>


            <form>

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label">

                        E-mail

                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required>

                </div>


                <div class="mb-3">

                    <label
                        for="senha"
                        class="form-label">

                        Senha

                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        minlength="8"
                        required>

                </div>


                <div class="text-end mb-3">

                    <a
                        href="#"
                        class="forgot-password">

                        Esqueceu a senha?

                    </a>

                </div>


                <a
                    href="dashboard.html"
                    class="btn btn-login w-100">

                    Entrar

                </a>


                <div class="text-center mt-4">

                    <p class="mb-1">
                        Ainda não possui uma conta?
                    </p>

                    <a
                        href="cadastro.html"
                        class="register-link">

                        Criar cadastro

                    </a>

                </div>


                <div class="text-center mt-4">

                    <a
                        href="index.html"
                        class="back-link">

                        ← Voltar para o site

                    </a>

                </div>

            </form>

        </div>

    </main>


    <footer class="login-footer">

        <p>
            &copy; 2026 K.Artes. Todos os direitos reservados.
        </p>

    </footer>
  <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
